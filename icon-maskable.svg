<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1b1c"/>
      <stop offset="100%" stop-color="#111213"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d9cdb"/>
      <stop offset="100%" stop-color="#56ccf2"/>
    </linearGradient>
  </defs>
  <!-- Full background (maskable safe zone = inner 80%) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Clock face — scaled to fit maskable safe zone -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#accent)" stroke-width="12"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <!-- Hour markers -->
  <g stroke="#fff" stroke-width="5" stroke-linecap="round">
    <line x1="256" y1="116" x2="256" y2="134"/><!-- 12 -->
    <line x1="396" y1="256" x2="378" y2="256"/><!-- 3 -->
    <line x1="256" y1="396" x2="256" y2="378"/><!-- 6 -->
    <line x1="116" y1="256" x2="134" y2="256"/><!-- 9 -->
  </g>
  <!-- Minor markers -->
  <g stroke="rgba(255,255,255,0.3)" stroke-width="3" stroke-linecap="round">
    <line x1="326" y1="134" x2="318" y2="148"/><!-- 1 -->
    <line x1="378" y1="186" x2="364" y2="194"/><!-- 2 -->
    <line x1="378" y1="326" x2="364" y2="318"/><!-- 4 -->
    <line x1="326" y1="378" x2="318" y2="364"/><!-- 5 -->
    <line x1="186" y1="378" x2="194" y2="364"/><!-- 7 -->
    <line x1="134" y1="326" x2="148" y2="318"/><!-- 8 -->
    <line x1="134" y1="186" x2="148" y2="194"/><!-- 10 -->
    <line x1="186" y1="134" x2="194" y2="148"/><!-- 11 -->
  </g>
  <!-- Hour hand -->
  <line x1="256" y1="256" x2="208" y2="183" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="256" y1="256" x2="304" y2="183" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <!-- Second hand -->
  <line x1="256" y1="256" x2="256" y2="148" stroke="#2d9cdb" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="10" fill="#2d9cdb"/>
  <circle cx="256" cy="256" r="5" fill="#fff"/>
</svg>
