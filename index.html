<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Makos Tech - Analog Clock</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2d9cdb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Makos Clock" />
  <link rel="apple-touch-icon" href="icon-192.svg" />

  <link rel="stylesheet" href="styles.css" />
  <script src="main.js" defer></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>
</head>

<body>
  <div class="container">

    <header class="topbar">
      
      <div class="brand">
        <div class="brand_name">Makos Tech</div>
        <div class="brand_tag">Analog Clock</div>
      </div>

      <div class="readout" aria-label="Digital time and date">
        <div class="readout_time" id="digital-time">--:--:--</div>
        <div class="readout_date" id="digital-date">---</div>
      </div>

      <div class="controls">
        
        <div class="theme-switch" aria-label="Color theme">
          <button class="theme-btn" data-theme="ocean" type="button">Ocean</button>
          <button class="theme-btn" data-theme="sunset" type="button">Sunset</button>
          <button class="theme-btn" data-theme="forest" type="button">Forest</button>
        </div>

        <div class="mode-switch" role="button" tabindex="0">
          Dark Mode
        </div>

      </div>
    </header>

    <!-- Install Banner -->
    <div class="install-banner" id="install-banner" hidden>
      <span class="install-text">📲 Install Makos Clock on your device</span>
      <button class="install-btn" id="install-btn" type="button">Install</button>
      <button class="install-dismiss" id="install-dismiss" type="button" aria-label="Dismiss">✕</button>
    </div>

    <div class="clock">
      <label style="--i: 1"><span>1</span></label>
      <label style="--i: 2"><span>2</span></label>
      <label style="--i: 3"><span>3</span></label>
      <label style="--i: 4"><span>4</span></label>
      <label style="--i: 5"><span>5</span></label>
      <label style="--i: 6"><span>6</span></label>
      <label style="--i: 7"><span>7</span></label>
      <label style="--i: 8"><span>8</span></label>
      <label style="--i: 9"><span>9</span></label>
      <label style="--i: 10"><span>10</span></label>
      <label style="--i: 11"><span>11</span></label>
      <label style="--i: 12"><span>12</span></label>

      <div class="indicator">
        <span class="hand hour"></span>
        <span class="hand minute"></span>
        <span class="hand second"></span>
      </div>
    </div>

  </div>
</body>
</html>
