<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1b1c"/>
      <stop offset="100%" stop-color="#111213"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d9cdb"/>
      <stop offset="100%" stop-color="#56ccf2"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <!-- Clock face -->
  <circle cx="96" cy="96" r="70" fill="none" stroke="url(#accent)" stroke-width="6"/>
  <circle cx="96" cy="96" r="60" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Hour markers -->
  <g stroke="#fff" stroke-width="2.5" stroke-linecap="round">
    <line x1="96" y1="32" x2="96" y2="40"/><!-- 12 -->
    <line x1="160" y1="96" x2="152" y2="96"/><!-- 3 -->
    <line x1="96" y1="160" x2="96" y2="152"/><!-- 6 -->
    <line x1="32" y1="96" x2="40" y2="96"/><!-- 9 -->
  </g>
  <!-- Minor markers -->
  <g stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round">
    <line x1="128.5" y1="40.2" x2="125" y2="46.3"/><!-- 1 -->
    <line x1="151.8" y1="63.5" x2="145.7" y2="67"/><!-- 2 -->
    <line x1="151.8" y1="128.5" x2="145.7" y2="125"/><!-- 4 -->
    <line x1="128.5" y1="151.8" x2="125" y2="145.7"/><!-- 5 -->
    <line x1="63.5" y1="151.8" x2="67" y2="145.7"/><!-- 7 -->
    <line x1="40.2" y1="128.5" x2="46.3" y2="125"/><!-- 8 -->
    <line x1="40.2" y1="63.5" x2="46.3" y2="67"/><!-- 10 -->
    <line x1="63.5" y1="40.2" x2="67" y2="46.3"/><!-- 11 -->
  </g>
  <!-- Hour hand (10:10 position) -->
  <line x1="96" y1="96" x2="74" y2="62" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="96" y1="96" x2="118" y2="62" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Second hand -->
  <line x1="96" y1="96" x2="96" y2="46" stroke="#2d9cdb" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="96" cy="96" r="5" fill="#2d9cdb"/>
  <circle cx="96" cy="96" r="2.5" fill="#fff"/>
</svg>
